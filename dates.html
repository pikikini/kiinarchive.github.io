<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기인 POP</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background-color: #f4f5fa; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    .top-bar { position: sticky; top: 0; background: #f4f5fa; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; max-width: 480px; margin: 0 auto; z-index: 100; }
    .top-left { width: 30px; }
    .top-title { font-weight: 700; font-size: 16px; color: #222; }
    .menu-btn { width: 30px; background: none; border: none; font-size: 20px; cursor: pointer; color: #222; text-align: right; padding: 0; }

    /* 슬라이드 메뉴 */
    .menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 200; }
    .menu-overlay.open { display: block; }
    .side-drawer { position: fixed; top: 0; right: -270px; width: 260px; height: 100%; background: #ffffff; z-index: 201; transition: right 0.25s ease; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: -2px 0 12px rgba(0,0,0,0.1); }
    .side-drawer.open { right: 0; }
    .drawer-header { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 12px; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; padding: 0; line-height: 1; }
    .menu-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    .menu-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; text-decoration: none; color: #333; font-size: 15px; font-weight: 600; }
    .menu-item:hover, .menu-item.active { background: #eef0fa; color: #5b62a8; }
    .drawer-footer { padding-top: 14px; border-top: 1px solid #eee; font-size: 11.5px; line-height: 1.55; color: #666; word-break: keep-all; }
    .drawer-footer p { margin: 0 0 6px 0; }
    .drawer-footer p:last-child { margin-bottom: 0; color: #888; font-size: 11px; }
    .handle-link { font-weight: 700; text-decoration: underline; color: #222; }

    /* 날짜 그리드 */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 6px 16px 30px; max-width: 480px; margin: 0 auto; }
    .date-card { background: #ffffff; aspect-ratio: 1 / 1; border-radius: 16px; display: flex; justify-content: center; align-items: center; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.15s; }
    .date-card:active { transform: scale(0.97); }
    .badge { background: #8b90c2; color: #ffffff; padding: 5px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-left"></div>
    <span class="top-title">by date</span>
    <button class="menu-btn" onclick="toggleMenu(true)">☰</button>
  </div>

  <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu(false)"></div>
  <div class="side-drawer" id="side-drawer">
    <div>
      <div class="drawer-header">
        <button class="close-btn" onclick="toggleMenu(false)">×</button>
      </div>
      <ul class="menu-list">
        <li><a class="menu-item" href="index.html">🏠</a></li>
        <li><a class="menu-item" href="chat.html">💌</a></li>
        <li><a class="menu-item" href="chat.html?mode=photos">🖼️</a></li>
        <li><a class="menu-item active" href="dates.html">by date</a></li>
      </ul>
    </div>
    <div class="drawer-footer">
      <p>오류, 문의는 <span class="handle-link">@pikikini</span> 계정으로 DM 주세요.</p>
      <p>For errors or inquiries, please DM <span class="handle-link">@pikikini</span>.</p>
    </div>
  </div>

  <div class="grid" id="date-grid"></div>

  <script>
    function toggleMenu(open) {
      document.getElementById('menu-overlay').classList.toggle('open', open);
      document.getElementById('side-drawer').classList.toggle('open', open);
    }
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById('date-grid');
        Object.keys(data).forEach(date => {
          const card = document.createElement('a');
          card.href = `chat.html?date=${date}`;
          card.className = 'date-card';
          card.innerHTML = `<span class="badge">${date}</span>`;
          grid.appendChild(card);
        });
      });
  </script>
</body>
</html>
