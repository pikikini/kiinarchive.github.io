<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기인 POP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #e4e6f5;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #222;
    }
    .home-card {
      width: 100%;
      max-width: 400px;
      min-height: 410px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 6px 24px rgba(85, 92, 148, 0.09);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid #eceef7;
      background: #fafbfe;
    }
    .tab-item {
      padding: 16px 0;
      text-align: center;
      text-decoration: none;
      font-size: 19px;
      border-right: 1px solid #eceef7;
      transition: background 0.15s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .tab-item:last-child { border-right: none; }
    .tab-item:hover, .tab-item:active { background: #eef0fa; }
    .card-body {
      padding: 36px 26px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .archive-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #2c2f42;
      margin: 0 0 16px 0;
    }
    .read-toggle {
      background: none;
      border: none;
      padding: 4px 0;
      font-size: 12.5px;
      font-weight: 600;
      color: #7b809e;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      font-family: inherit;
    }
    .read-toggle:hover { color: #4a4f70; }
    .arrow-icon {
      font-size: 10px;
      transition: transform 0.2s ease;
      display: inline-block;
    }
    .read-toggle.open .arrow-icon { transform: rotate(90deg); }
    .read-content {
      display: none;
      margin-top: 12px;
      padding: 15px 16px;
      background: #f7f8fc;
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.75;
      color: #555970;
      word-break: keep-all;
    }
    .read-content.open { display: block; }
    .guide-list {
      margin: 0 0 12px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #e6e8f2;
    }
    .notice-list { margin: 0; }
  </style>
</head>
<body>
  <div class="home-card">
    <div class="card-tabs">
      <a href="chat.html" class="tab-item" title="전체 메시지">💌</a>
      <a href="chat.html?mode=photos" class="tab-item" title="사진">🖼️</a>
      <a href="dates.html" class="tab-item" title="날짜별">📅</a>
    </div>
    <div class="card-body">
      <h1 class="archive-title">2026 KIIN POP ARCHIVE 💌</h1>
      <button class="read-toggle" id="read-btn" onclick="toggleRead()">
        <span class="arrow-icon">▸</span>
        <span>read</span>
      </button>
      <div class="read-content" id="read-box">
        <div class="guide-list">
          💌 전체 메시지 확인 message<br>
          🖼️ 전체 사진 확인 photo<br>
          by date 날짜별 보기
        </div>
        <div class="notice-list">
          ‼️<br>
          - 무단 캡쳐•복제•배포를 금지합니다.<br>
          - 오류, 문의사항은 @pikikini 계정으로 DM 부탁드립니다.
        </div>
      </div>
    </div>
  </div>
  <script>
    function toggleRead() {
      document.getElementById('read-btn').classList.toggle('open');
      document.getElementById('read-box').classList.toggle('open');
    }
  </script>
</body>
</html>
